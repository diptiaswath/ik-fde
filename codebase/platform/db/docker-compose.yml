# Local Meridian Postgres — the $0/offline fallback mirror of the hosted Supabase DB.
# Same schema, same (deterministic) seed data. `docker compose up -d` then ./load.sh
services:
  meridian-db:
    image: postgres:16
    container_name: meridian-db
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  meridian-pgdata:
